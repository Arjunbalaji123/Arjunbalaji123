<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Arjun Balaji S - Full-Stack Developer and Data/ML learner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#120f33"/>
      <stop offset="1" stop-color="#06202e"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="g1"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#ec4899" stop-opacity="0.5"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>

    <!-- aurora glow -->
    <g>
      <circle cx="180" cy="60" r="190" fill="url(#g1)">
        <animateTransform attributeName="transform" type="translate" values="0 0;120 40;0 0" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="620" cy="300" r="220" fill="url(#g2)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-160 -30;0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1080" cy="40" r="180" fill="url(#g3)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-90 60;0 0" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- floating glyphs -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="22" fill="#94a3b8" fill-opacity="0.25">
      <text x="640" y="60">&lt;/&gt;
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="6s" repeatCount="indefinite"/>
      </text>
      <text x="60" y="40">{ }
        <animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="7s" repeatCount="indefinite"/>
      </text>
      <text x="520" y="300">SELECT *
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="8s" repeatCount="indefinite"/>
      </text>
      <text x="1150" y="305">01
        <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="5s" repeatCount="indefinite"/>
      </text>
      <text x="330" y="40">f(x)
        <animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="9s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- left: identity -->
    <text x="60" y="92" font-family="Consolas, 'Courier New', monospace" font-size="16" letter-spacing="6" fill="#7dd3fc">HELLO, I'M</text>
    <text x="60" y="165" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" fill="url(#name)">Arjun Balaji S</text>
    <text x="62" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#e2e8f0">Full-Stack Developer  ·  Data &amp; ML Learner</text>

    <!-- rotating tagline -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="18" fill="#94a3b8">
      <text x="62" y="258">&gt; building web apps from UI to database
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.03;0.30;0.33;1" values="0;1;1;0;0"/>
      </text>
      <text x="62" y="258" opacity="0">&gt; turning raw data into models that explain it
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.36;0.63;0.66;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="62" y="258" opacity="0">&gt; showing up, shipping, and iterating
        <animate attributeName="opacity" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.69;0.96;1" values="0;0;1;1;0"/>
      </text>
    </g>

    <!-- right: code card -->
    <rect x="730" y="42" width="420" height="238" rx="14" fill="#0b1224" fill-opacity="0.88" stroke="#334155"/>
    <circle cx="756" cy="66" r="6" fill="#f87171"/>
    <circle cx="776" cy="66" r="6" fill="#fbbf24"/>
    <circle cx="796" cy="66" r="6" fill="#4ade80"/>
    <text x="1130" y="70" text-anchor="end" font-family="Consolas, 'Courier New', monospace" font-size="12" fill="#64748b">arjun.js</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#cbd5e1">
      <text x="756" y="108"><tspan fill="#c084fc">const</tspan> <tspan fill="#7dd3fc">arjun</tspan> = {
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.04;0.06;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="778" y="132"><tspan fill="#7dd3fc">role</tspan>: <tspan fill="#fcd34d">"Full-Stack + Data/ML"</tspan>,
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.11;0.13;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="778" y="156"><tspan fill="#7dd3fc">school</tspan>: <tspan fill="#fcd34d">"CIT · M.Sc Software Sys"</tspan>,
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.18;0.20;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="778" y="180"><tspan fill="#7dd3fc">projects</tspan>: <tspan fill="#fb923c">6</tspan>, <tspan fill="#7dd3fc">hackathons</tspan>: <tspan fill="#fb923c">2</tspan>,
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="778" y="204"><tspan fill="#7dd3fc">effort</tspan>: <tspan fill="#fcd34d">"all in"</tspan>,
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.32;0.34;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="778" y="228"><tspan fill="#7dd3fc">openToWork</tspan>: <tspan fill="#86efac">true</tspan>
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.39;0.41;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <text x="756" y="252">};
        <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.46;0.48;0.9;0.96;1" values="0;0;1;1;0;0"/>
      </text>
      <rect x="776" y="238" width="9" height="18" fill="#7dd3fc">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="x" dur="14s" repeatCount="indefinite" keyTimes="0;0.5;1" values="776;776;776"/>
      </rect>
    </g>
  </g>
</svg>
